name: flutter_chat_pro
description: >
  Backend-agnostic chat kit for Flutter: typed models, built-in SQLite cache,
  offline outbox, controllers, and a fully customizable chat room and inbox UI.
version: 1.0.0
homepage: https://github.com/fodilfliti/flutter_chat_kit
repository: https://github.com/fodilfliti/flutter_chat_kit
issue_tracker: https://github.com/fodilfliti/flutter_chat_kit/issues
documentation: https://github.com/fodilfliti/flutter_chat_kit#readme

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  audioplayers: ^6.8.1
  cached_network_image: ^4.0.4
  collection: ^1.19.1
  cross_file: ^0.3.5+5
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  lemsa_core_kit: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.1
  # 0.2 adds a Linux plugin that needs FFmpeg dev packages to build.
  stream_thumbnail: ^0.1.0+1
  super_sliver_list: ^0.4.1
  uuid: ^4.6.0
  video_player: ^2.14.0
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - flutter
  - chat
  - messaging
  - offline
  - ui

screenshots:
  - description: Chat room with images, a reply and a custom offer message
    path: screenshots/chat.png

flutter:
